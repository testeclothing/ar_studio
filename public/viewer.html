<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet AR Viewer</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #start-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #2563eb; color: white;
            border: none; border-radius: 25px; font-size: 18px; font-weight: bold;
            z-index: 999; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-btn">🔊 Tocar para Iniciar</div>

    <a-scene mindar-image="" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" loop="true" crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
            <a-video src="#vid" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            alert("Erro: ID da experiência não encontrado.");
        } else {
            const mindFileUrl = `/uploads/${id}/targets.mind`;
            const videoUrl = `/uploads/${id}/video.mp4`;

            const scene = document.querySelector('a-scene');
            const video = document.querySelector('#vid');
            
            // Configurar a cena com os ficheiros dinâmicos
            scene.setAttribute('mindar-image', `imageTargetSrc: ${mindFileUrl}; filterMinCF:0.0001; filterBeta: 0.001;`);
            video.src = videoUrl;

            const startBtn = document.getElementById('start-btn');
            
            startBtn.addEventListener('click', () => {
                video.play();
                video.pause(); 
                startBtn.classList.add('hidden');
            });

            const target = document.querySelector('#target-entity');
            
            target.addEventListener("targetFound", event => {
                console.log("Imagem encontrada!");
                video.play();
            });

            target.addEventListener("targetLost", event => {
                console.log("Imagem perdida...");
                video.pause();
            });
        }
    </script>
</body>
</html>
